name: Build local product photography from Openverse

on:
  push:
    branches: [main]
    paths:
      - "data/shop-catalog.json"
      - ".github/workflows/import-openverse-shop-images.yml"

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow opencv-python-headless==4.10.0.84
      - name: Search Openverse and save real photos locally
        run: |
          python - <<'PY'
          from pathlib import Path
          import io, json, time, re
          import requests
          from PIL import Image, ImageFilter
          import cv2, numpy as np

          catalog=json.loads(Path("data/shop-catalog.json").read_text(encoding="utf-8"))
          items=catalog["products"]
          out=Path("assets/shop/catalog")
          out.mkdir(parents=True,exist_ok=True)

          session=requests.Session()
          session.headers.update({
              "User-Agent":"AnnikaShop/1.0 (local licensed image importer)"
          })
          detector=cv2.CascadeClassifier(cv2.data.haarcascades+"haarcascade_frontalface_default.xml")

          # Reuse a local image only when it is already assigned to the same product.
          # Across different products we enforce distinct Openverse identifiers.
          used=set()
          metadata=[]
          failures=[]

          def safe_slug(s):
              return re.sub(r"[^a-z0-9-]+","-",s.lower()).strip("-")[:120]

          def blur_faces(im):
              rgb=im.convert("RGB")
              arr=np.array(rgb)
              gray=cv2.cvtColor(arr,cv2.COLOR_RGB2GRAY)
              boxes=detector.detectMultiScale(gray,1.08,5,minSize=(36,36))
              result=rgb.copy()
              for x,y,w,h in boxes:
                  px,py=int(w*.30),int(h*.30)
                  x1=max(0,x-px);y1=max(0,y-py);x2=min(result.width,x+w+px);y2=min(result.height,y+h+py)
                  crop=result.crop((x1,y1,x2,y2)).filter(ImageFilter.GaussianBlur(max(10,int(min(w,h)*.28))))
                  result.paste(crop,(x1,y1))
              return result

          def fetch_results(query,page=1):
              url="https://api.openverse.org/v1/images/"
              params={
                  "q":query,
                  "license_type":"commercial",
                  "page_size":20,
                  "page":page,
                  "mature":"false"
              }
              for attempt in range(4):
                  r=session.get(url,params=params,timeout=45)
                  if r.status_code==429:
                      time.sleep(3*(attempt+1));continue
                  r.raise_for_status()
                  return r.json().get("results",[])
              return []

          for index,item in enumerate(items,1):
              slug=item["slug"]
              target=out/(slug+".jpg")
              query=item["query"]
              chosen=None
              try:
                  for page in range(1,4):
                      results=fetch_results(query,page)
                      for cand in results:
                          ident=cand.get("identifier") or cand.get("id") or cand.get("url")
                          img_url=cand.get("url")
                          if not img_url or ident in used:
                              continue
                          # Favor actual photos with enough detail and no watermark.
                          if cand.get("watermarked") is True:
                              continue
                          if (cand.get("width") or 0) and (cand.get("width")<500):
                              continue
                          chosen=cand
                          chosen["_ident"]=ident
                          break
                      if chosen: break
                  if not chosen:
                      raise RuntimeError("No unique commercial-use image found in Openverse results")

                  raw=session.get(chosen["url"],timeout=90)
                  raw.raise_for_status()
                  im=Image.open(io.BytesIO(raw.content)).convert("RGB")
                  max_w=1000
                  if im.width>max_w:
                      h=int(im.height*max_w/im.width)
                      im=im.resize((max_w,h),Image.Resampling.LANCZOS)
                  im=blur_faces(im)
                  im.save(target,"JPEG",quality=82,optimize=True,progressive=True)
                  used.add(chosen["_ident"])
                  metadata.append({
                      "id":item["id"],"name":item["name"],"section":item["section"],
                      "subsection":item["subsection"],"query":query,
                      "file":str(target),
                      "identifier":chosen.get("_ident"),
                      "title":chosen.get("title"),
                      "creator":chosen.get("creator"),
                      "license":chosen.get("license"),
                      "license_version":chosen.get("license_version"),
                      "license_url":chosen.get("license_url"),
                      "provider":chosen.get("provider"),
                      "source":chosen.get("source"),
                      "foreign_landing_url":chosen.get("foreign_landing_url"),
                      "original_url":chosen.get("url")
                  })
                  print(f"[{index}/{len(items)}] saved {target}")
              except Exception as exc:
                  failures.append({"id":item["id"],"name":item["name"],"query":query,"error":str(exc)})
                  print(f"[{index}/{len(items)}] FAILED {item['name']}: {exc}")

          Path("assets/shop/catalog/SOURCES.json").write_text(
              json.dumps({"source":"Openverse","warning":"Openverse notes that license metadata should be verified before use.","items":metadata,"failures":failures},indent=2,ensure_ascii=False),
              encoding="utf-8"
          )
          if failures:
              # Keep successful assets, but fail the build so incomplete catalog cannot be mistaken for finished.
              raise SystemExit(f"{len(failures)} catalog images failed")
          PY
      - name: Commit local catalog photos
        run: |
          git config user.name "annika-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/shop/catalog
          git diff --cached --quiet || git commit -m "Add local licensed product photography for complete catalog"
          git push
