name: Import real modest fashion media

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-media:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download real photos and video
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -L --fail --retry 3 'https://images.pexels.com/photos/5991455/pexels-photo-5991455.jpeg?cs=srgb&dl=pexels-anntarazevich-5991455.jpg&fm=jpg' -o assets/real-fashion-01.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/5973776/pexels-photo-5973776.jpeg?cs=srgb&dl=pexels-tima-miroshnichenko-5973776.jpg&fm=jpg' -o assets/real-fashion-02.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/16949473/pexels-photo-16949473.jpeg?cs=srgb&dl=pexels-jean-marc-bonnel-387362531-16949473.jpg&fm=jpg' -o assets/real-fashion-03.jpg
          curl -L --fail --retry 3 'https://images.pexels.com/photos/13720760/pexels-photo-13720760.jpeg?cs=srgb&dl=pexels-ayrizbuhayra-13720760.jpg&fm=jpg' -o assets/real-fashion-04.jpg
          curl -L --fail --retry 3 'https://www.pexels.com/download/video/16605720/' -o assets/real-fashion-film.mp4
          file assets/real-fashion-01.jpg assets/real-fashion-02.jpg assets/real-fashion-03.jpg assets/real-fashion-04.jpg assets/real-fashion-film.mp4
          test -s assets/real-fashion-film.mp4

      - name: Switch Fashion page to repo-local real media
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('fashion.html')
          s=p.read_text()
          replacements={
              '/assets/fashion-01.svg':'/assets/real-fashion-01.jpg',
              '/assets/fashion-02.svg':'/assets/real-fashion-02.jpg',
              '/assets/fashion-03.svg':'/assets/real-fashion-03.jpg',
              '/assets/fashion-04.svg':'/assets/real-fashion-04.jpg',
              '/assets/fashion-film.mp4':'/assets/real-fashion-film.mp4',
          }
          for a,b in replacements.items(): s=s.replace(a,b)
          s=s.replace('Fully covered modest-fashion editorial illustration with no visible face','Real modest-fashion photo, full back/covered view with no visible face')
          s=s.replace('Fully covered hijab fashion illustration with no visible face','Real modest-fashion photo, rear view with no visible face')
          s=s.replace('Fully covered abaya fashion illustration with no visible face','Real abaya photo, rear view with no visible face')
          s=s.replace('Fully covered burkha fashion illustration with no visible face','Real burqa photo, face fully concealed')
          s=s.replace('Fully covered modest wardrobe illustration with no visible face','Real modest-fashion photo, rear view with no visible face')
          s=s.replace("A locally hosted fashion film gives the page movement while keeping the media inside Annïka's own repository.","A real locally hosted fashion film keeps the page cinematic while the original media file stays inside Annïka's own repository.")
          s=s.replace('No external video redirect','Real video file stored locally in the Annïka repository')
          p.write_text(s)

          p=Path('app.js')
          s=p.read_text()
          s=s.replace("animationStyle.href='/animations-v2.css?v=2';","animationStyle.href='/animations-v3.css?v=3';")
          s=s.replace("const localImages=['/assets/fashion-01.svg','/assets/fashion-02.svg','/assets/fashion-03.svg','/assets/fashion-04.svg'];","const localImages=['/assets/real-fashion-01.jpg','/assets/real-fashion-02.jpg','/assets/real-fashion-03.jpg','/assets/real-fashion-04.jpg'];")
          s=s.replace("Fully covered modest-fashion editorial illustration with face and body details concealed","Real modest-fashion photo with full coverage and no visible face")
          s=s.replace("Fully covered modest fashion visual for ${['Hijab','Abaya','Burkha','Wardrobe'][index]||'modest wardrobe'}","Real modest-fashion photo with face fully concealed for ${['Hijab','Abaya','Burqa','Wardrobe'][index]||'modest wardrobe'}")
          s=s.replace("Fully covered modest fashion editorial illustration with face concealed","Real modest-fashion photo with full coverage and no visible face")
          s=s.replace("/assets/fashion-film.mp4","/assets/real-fashion-film.mp4")
          s=s.replace('Local Annïka modest fashion film with fully covered figure','Real Annïka modest fashion film with no visible face')
          p.write_text(s)
          PY

      - name: Harden animation loading
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('.').glob('*.html'):
              s=p.read_text()
              if '/animations-v3.css?v=3' not in s:
                  s=s.replace('<link rel="stylesheet" href="/styles.css">','<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/animations-v3.css?v=3">',1)
                  s=s.replace('<script src="/app.js" defer></script>','<script src="/app.js?v=3" defer></script>',1)
                  p.write_text(s)
          PY

      - name: Commit files and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/real-fashion-01.jpg assets/real-fashion-02.jpg assets/real-fashion-03.jpg assets/real-fashion-04.jpg assets/real-fashion-film.mp4 app.js animations-v3.css *.html
          git rm .github/workflows/import-real-fashion-media.yml
          git commit -m 'Use real face-hidden fashion media and harden animations'
          git push
