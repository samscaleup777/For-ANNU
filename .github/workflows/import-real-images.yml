name: Import real local shop photography

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-real-images.yml"

permissions:
  contents: write

jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow opencv-python-headless==4.10.0.84
      - name: Download direct CDN photos, blur faces, optimize
        run: |
          python - <<'PY'
          from pathlib import Path
          import io
          import requests
          from PIL import Image, ImageFilter
          import cv2
          import numpy as np

          items = [
            ("01-embroidered-navy-abaya.jpg", "35344026", True),
            ("02-navy-embroidered-abaya.jpg", "35344027", True),
            ("03-navy-abaya-with-bag.jpg", "35344028", True),
            ("04-full-length-navy-abaya.jpg", "35263629", True),
            ("05-grey-modest-set.jpg", "35463006", True),
            ("06-teal-hijab-modest-set.jpg", "35263645", True),
            ("07-traditional-hijab-abaya.jpg", "35357620", True),
            ("08-pink-hijab-abaya.jpg", "19985548", True),
            ("09-brown-abaya-hijab.jpg", "29188563", True),
            ("10-embroidered-abaya.jpg", "17833527", True),
            ("11-handbag.jpg", "12471934", False),
            ("12-perfume.jpg", "19086285", False),
            ("13-lipstick-blush.jpg", "2533266", False),
            ("14-necklace.jpg", "15856345", False),
            ("15-womens-heels.jpg", "5713317", False),
            ("16-quran-open.jpg", "20784496", False),
            ("17-quran-tasbih.jpg", "35382849", False),
            ("18-tote-bag.jpg", "18018268", False),
            ("19-makeup-flatlay.jpg", "8776814", False),
            ("20-jewelry-set.jpg", "28664773", False),
            ("21-lipstick.jpg", "14444882", False),
            ("22-cosmetic-products.jpg", "2535913", False),
            ("23-hijab-scarf-detail.jpg", "30992409", True),
            ("24-hijab-black.jpg", "8422407", True),
            ("25-colorful-modest-fashion.jpg", "7249758", True),
            ("26-skincare-flatlay.jpg", "34939726", False),
            ("27-haircare-products.jpg", "7440062", False),
            ("28-argan-haircare.jpg", "10427813", False),
            ("29-hair-oil-care.jpg", "7428095", False),
          ]

          out = Path("assets/shop/real")
          out.mkdir(parents=True, exist_ok=True)
          session = requests.Session()
          session.headers.update({"User-Agent":"AnnikaShopAssetImporter/1.0"})

          detector = cv2.CascadeClassifier(cv2.data.haarcascades + "haarcascade_frontalface_default.xml")

          def blur_faces(im, likely_person):
              rgb = im.convert("RGB")
              arr = np.array(rgb)
              gray = cv2.cvtColor(arr, cv2.COLOR_RGB2GRAY)
              boxes = detector.detectMultiScale(gray, scaleFactor=1.08, minNeighbors=5, minSize=(42,42))
              result = rgb.copy()
              for (x,y,w,h) in boxes:
                  px,py=int(w*0.35),int(h*0.35)
                  x1=max(0,x-px); y1=max(0,y-py); x2=min(result.width,x+w+px); y2=min(result.height,y+h+py)
                  crop=result.crop((x1,y1,x2,y2)).filter(ImageFilter.GaussianBlur(max(12,int(min(w,h)*0.30))))
                  result.paste(crop,(x1,y1))
              if likely_person and len(boxes)==0:
                  # Conservative fallback for fashion portraits whose detector misses a face:
                  # soften the central upper portrait area without altering the garment.
                  w=int(result.width*0.38); h=int(result.height*0.24)
                  x=(result.width-w)//2; y=int(result.height*0.08)
                  crop=result.crop((x,y,x+w,y+h)).filter(ImageFilter.GaussianBlur(22))
                  result.paste(crop,(x,y))
              return result

          sources=[]
          failures=[]
          for filename, pid, likely_person in items:
              url=f"https://images.pexels.com/photos/{pid}/pexels-photo-{pid}.jpeg?auto=compress&cs=tinysrgb&w=900"
              try:
                  r=session.get(url,timeout=60)
                  r.raise_for_status()
                  im=Image.open(io.BytesIO(r.content)).convert("RGB")
                  max_w=900
                  if im.width>max_w:
                      h=int(im.height*max_w/im.width)
                      im=im.resize((max_w,h),Image.Resampling.LANCZOS)
                  im=blur_faces(im,likely_person)
                  im.save(out/filename,format="JPEG",quality=86,optimize=True,progressive=True)
                  sources.append((filename,pid,url))
                  print("saved",filename,im.size)
              except Exception as e:
                  failures.append((filename,pid,str(e)))
                  print("FAILED",filename,e)

          (out/"SOURCES.txt").write_text(
              "Annïka Shop local photography\n"
              "Source: Pexels direct CDN URLs. Files are copied into this repository so the website does not depend on remote image URLs.\n"
              "Where a photo contains a person, faces are blurred locally before saving.\n\n"
              + "\n".join(f"{name} <- Pexels photo {pid} <- {url}" for name,pid,url in sources)
              + ("\n\nFailures:\n" + "\n".join(f"{n} ({p}): {e}" for n,p,e in failures) if failures else ""),
              encoding="utf-8"
          )
          if failures:
              raise SystemExit(1)
          PY
      - name: Commit local photos
        run: |
          git config user.name "annika-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/shop/real
          git diff --cached --quiet || git commit -m "Add real local Annïka shop photography"
          git push
