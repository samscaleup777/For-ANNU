name: Build complete local product photo catalog

on:
  push:
    branches: [main]
    paths:
      - "data/shop-catalog.json"
      - ".github/workflows/import-pexels-catalog.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: annika-pexels-catalog
  cancel-in-progress: true

jobs:
  build-images:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow opencv-python-headless==4.10.0.84

      - name: Download, blur and assign real photos
        env:
          PEXELS_CDN_BASE: "https://images.pexels.com/photos"
        run: |
          python - <<'PY'
          from pathlib import Path
          import io, json, re, time
          import requests
          from PIL import Image, ImageFilter, ImageOps
          import cv2, numpy as np

          ROOT=Path(".")
          data=json.loads((ROOT/"data/shop-catalog.json").read_text(encoding="utf-8"))
          products=data["products"]

          # Curated real-photo pools. These are Pexels photo pages that present
          # the media as free to use/free download. The site stores the downloaded
          # bytes locally, so storefront pages never request these URLs at runtime.
          sources={
            "modest":[
              35344026,35344027,36514932,7249739,19985548,13195217,12472844,
              29118562,8995933,8217891,8422394,34427197,6282026,9219303,
              33539328,7249758,36765971,13791550,17833527,35324617,35324621,
              35324626,12208801,14850599,32321146,9881167,8422432,8995843,
              13584944,26748565,19589316,9881080
            ],
            "beauty":[
              8101530,29752560,11935645,7691100,11935638,9774784,3735651,
              7691164,16008945,10574130,3736398,4239013,7691112,10221835,
              27544680,13095140,10574048,7691166,7691161,7691162,3785147,
              7691098,33429141,7664090,36701023,2536009
            ],
            "hair":[7440062,10427813,7440053,7428095,10427811,17576518],
            "innerwear":[5253482,20194197,6568233,5253436,5253472],
            "bags":[
              10280614,13596388,5658856,6120155,7944717,19091741,
              3768600,35685411,19091737,16794722,16794718,3607627
            ],
            "jewelry":[15856345,16210460,12133443,5497303,28664773,14444882],
            "shoes":[11813801,15677287,11360722,1600052,18888356,5177177],
            "faith":[8522567,20784496,35382849,7957080,34427197],
            "hygiene":[6590808,6590829,7692272,5938424,5218023,5712321,3958555,6590809],
            "fitness":[
              4376869,6551426,36990304,38642004,36387526,3854767,
              36990297,903171,36387536,17086560,918576,13965872
            ],
            "stationery":[
              6368842,36048039,6368839,5797900,5717416,38840588,
              12911169,7439132,5124877,33936499,15422289,38840592
            ],
            "home":[
              15664176,5825571,6444976,4078611,5357338,11295759,
              15717923,12670586,16497537,5629134,7445123,6207459
            ],
            "tech":[
              7856680,10907349,234872,7987846,4152003,5208772,
              5948345,7856657,21391565,16247545
            ],
            "grooming":[9706941,18224894,16041439,6135673,34930156,6135684,7755212,4677843],
            "clothing_care":[4610582,6665039,19496818,7256911,1855203,25955763,6461518,35166552],
            "travel":[16340997,7009465],
            "safety":[5673523,31837694,31837693,5146534,11894049,7722685,6520129,5664736,8241147],
            "existing_real":[]
          }

          # Only the current curated source pools are used; legacy shop photos are not required.\n          existing_map={}\n\n          local_sources=existing_map
          metadata=[]
          # Copy a relevant, locally stored real photo to every product slug.
          # Source is varied deterministically inside each relevant pool.
          counters={}
          for idx,p in enumerate(products,1):
              pool=choose_pool(p)
              counters.setdefault(pool,0)
              pools=[downloaded[(pool,i)] for i in range(1,len(sources.get(pool,[]))+1) if (pool,i) in downloaded]
              if not pools:
                  pools=[Path(x) for x in local_sources.get(pool,[]) if Path(x).exists()]
              if not pools:
                  pools=[Path(x) for x in existing_map["modest"] if Path(x).exists()]
              if not pools:
                  failures.append(("assignment",idx,p["name"],"no local pool available"))
                  continue
              counters[pool]+=1
              src=pools[(counters[pool]-1)%len(pools)]
              # Use a product-specific local file. Images remain real photos; person
              # faces have already been blurred in the source processing step.
              im=Image.open(src).convert("RGB")
              # Normalize enough for a stable e-commerce card while keeping natural photo geometry.
              if im.width>900:
                  h=int(im.height*900/im.width)
                  im=im.resize((900,h),Image.Resampling.LANCZOS)
              target=out/(p["slug"]+".jpg")
              im.save(target,"JPEG",quality=78,optimize=True,progressive=True)
              metadata.append({
                  "id":p["id"],"name":p["name"],"section":p["section"],"subsection":p["subsection"],
                  "file":str(target),"source_pool":pool,
                  "source_file":str(src)
              })
              print(f"PRODUCT [{idx}/350] {p['name']} <- {src}")

          (out/"SOURCES.json").write_text(json.dumps({
              "note":"Product images are local copies stored in the Git repository. Source photography was downloaded from Pexels direct CDN URLs and processed locally to blur detected faces.",
              "products":metadata,
              "download_failures":failures
          },indent=2,ensure_ascii=False),encoding="utf-8")

          if len(metadata)<len(products):
              raise SystemExit(f"Only {len(metadata)}/{len(products)} product images were built")
          PY

      - name: Commit all local product photos
        run: |
          git config user.name "annika-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/shop/catalog
          git diff --cached --quiet || git commit -m "Add 350 local real product photos for Annïka catalog"
          # Pull any site-code commits made while the image build was running,
          # then replay the image commit on top so binary assets push cleanly.
          git pull --rebase origin main
          git push origin HEAD:main
