name: Import owner-provided Annika catalog photos

on:
  push:
    paths:
      - ".github/workflows/import-owner-catalog-photos.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-reviewed-catalog-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Download the reviewed image pack
        env:
          IMAGE_PACK_URL: "https://at.adobe.com/RXDuvOxqIzNxHjPs"
        run: |
          set -euo pipefail
          curl --fail --location --retry 2 --retry-all-errors --connect-timeout 20 --max-time 300 "$IMAGE_PACK_URL" -o "$RUNNER_TEMP/annika-image-pack.zip"
          unzip -t "$RUNNER_TEMP/annika-image-pack.zip"
          mkdir -p "$RUNNER_TEMP/annika-image-pack"
          unzip -q "$RUNNER_TEMP/annika-image-pack.zip" -d "$RUNNER_TEMP/annika-image-pack"
          test "$(find "$RUNNER_TEMP/annika-image-pack/assets/shop/catalog/user-provided" -maxdepth 1 -type f -name 'source-*.jpg' | wc -l)" -eq 335
          test "$(tail -n +2 "$RUNNER_TEMP/annika-image-pack/maintenance/user-image-source-map.csv" | wc -l)" -eq 335

      - name: Add user photos and review assets
        run: |
          set -euo pipefail
          PACK="$RUNNER_TEMP/annika-image-pack"
          mkdir -p assets/shop/catalog maintenance/user-image-import
          cp -a "$PACK/assets/shop/catalog/user-provided" assets/shop/catalog/
          cp "$PACK/INSTALL_USER_CATALOG_IMAGES.py" ./INSTALL_USER_CATALOG_IMAGES.py
          cp "$PACK/fashion-image-overrides.css" ./fashion-image-overrides.css
          cp "$PACK/maintenance/user-image-source-map.csv" maintenance/user-image-source-map.csv
          cp "$PACK/README_IMPORT.md" maintenance/user-image-import/README_IMPORT.md
          cp "$PACK/REVIEW_SUMMARY.txt" maintenance/user-image-import/REVIEW_SUMMARY.txt
          cp -a "$PACK/maintenance/mapping-contact-sheets" maintenance/user-image-import/

      - name: Adapt installer to existing local-only shop code
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("INSTALL_USER_CATALOG_IMAGES.py")
          source = p.read_text(encoding="utf-8")
          start = source.index('    start = shop_js.find("async function fetchBetterPhoto(p,img,credit){")')
          end = source.index("    # Cache keys are bumped", start)
          replacement = '''    start = shop_js.find("async function fetchBetterPhoto(p,img,credit){")
              if start >= 0:
                  end = shop_js.find("async function init(){", start + 1)
                  if end < 0:
                      die("Could not safely locate init() in shop.js.")
                  shop_js = (
                      shop_js[:start]
                      + "function fetchBetterPhoto(){ return Promise.resolve(); }\\n"
                      + "function enableRemotePhotoRefinement(){ return; }\\n"
                      + shop_js[end:]
                  )
              elif not ("function fetchBetterPhoto(){ return Promise.resolve(); }" in shop_js and "function enableRemotePhotoRefinement(){ return; }" in shop_js):
                  die("Could not safely locate remote photo-refinement functions in shop.js; no writes performed.")

              old_assignment = "state.products=(data.products||[]).map(p=>verifiedPhotoIds.has(String(p.id))?p:{...p,image:productOnlyPlaceholder(p)});"
              if old_assignment in shop_js:
                  shop_js = shop_js.replace(old_assignment, "state.products=(data.products||[]);")
              elif "state.products=(data.products||[]);" not in shop_js:
                  pattern = r"state\\.products\\s*=\\s*\\(data\\.products\\|\\|\\[\\]\\)\\.map\\(p=>verifiedPhotoIds\\.has\\(String\\(p\\.id\\)\\)\\?p:\\{\\.\\.\\.p,image:productOnlyPlaceholder\\(p\\)\\}\\);"
                  shop_js, count = re.subn(pattern, "state.products=(data.products||[]);", shop_js)
                  if count != 1:
                      die("Could not safely replace catalog placeholder mapping in shop.js; no writes performed.")

          '''
          source = source[:start] + replacement + source[end:]
          p.write_text(source, encoding="utf-8")
          print("Installer compatibility patch applied.")
          PY

      - name: Map photos to products and disable remote image substitutions
        run: |
          set -euo pipefail
          python3 INSTALL_USER_CATALOG_IMAGES.py --repo-root .
          git diff --check
          python3 - <<'PY'
          import csv, json
          from pathlib import Path
          root = Path('.')
          catalog = json.loads((root/'data/shop-catalog.json').read_text(encoding='utf-8'))
          products = catalog['products']
          assert len(products) == 350, f"Expected 350 products, got {len(products)}"
          assigned = [p for p in products if p.get('image_source') == 'user-provided-local-reviewed']
          placeholders = [p for p in products if p.get('image_source') == 'local-placeholder-unmatched']
          assert len(assigned) == 303, f"Expected 303 reviewed assignments, got {len(assigned)}"
          assert len(placeholders) == 47, f"Expected 47 cautious placeholders, got {len(placeholders)}"
          assert len({p['id'] for p in assigned}) == len(assigned), "Duplicate product IDs assigned"
          for product in products:
              image = product['image'].lstrip('/')
              assert image.startswith('assets/shop/catalog/'), f"Unexpected image path: {product['image']}"
              assert (root/image).is_file(), f"Missing local image: {product['image']}"
          assert 'function enableRemotePhotoRefinement(){ return; }' in (root/'shop.js').read_text(encoding='utf-8')
          assert 'href="/fashion-image-overrides.css?v=1"' in (root/'fashion.html').read_text(encoding='utf-8')
          audit = list(csv.DictReader((root/'maintenance/user-image-review-report.csv').open(encoding='utf-8-sig')))
          assert len(audit) == 335, f"Expected 335 source audit rows, got {len(audit)}"
          print(f"VALIDATED: {len(products)} products, {len(assigned)} reviewed local photo assignments, {len(placeholders)} local placeholder fallbacks, {len(audit)} source images audited.")
          PY

      - name: Remove the one-time installer workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/import-owner-catalog-photos.yml
          rm -f INSTALL_USER_CATALOG_IMAGES.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shop/catalog/user-provided data/shop-catalog.json shop.js fashion.html fashion-image-overrides.css maintenance/user-image-source-map.csv maintenance/catalog-image-audit.csv maintenance/user-image-review-report.csv maintenance/user-image-map-preview.html maintenance/user-image-import
          git add -u .github/workflows/import-owner-catalog-photos.yml
          git commit -m "Import reviewed owner-provided catalog photos"
          git push origin HEAD:main
