name: Deep refresh real catalog photos

on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_catalog_photos.py'
      - 'data/shop-catalog.json'
      - '.github/workflows/refresh-real-catalog-images.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow imagehash

      - name: Refresh 350 product photos
        run: python scripts/refresh_catalog_photos.py

      - name: Verify complete catalog
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cat=json.loads(Path('data/shop-catalog.json').read_text(encoding='utf-8'))['products']
          files=list(Path('assets/shop/catalog').glob('*.*'))
          assert len(cat)==350, f'Expected 350 products, found {len(cat)}'
          jpg={p.stem for p in files if p.suffix.lower() in {'.jpg','.jpeg','.png','.webp'}}
          missing=[p['slug'] for p in cat if p['slug'] not in jpg]
          assert not missing, f'Missing product images: {missing[:10]}'
          print(f'PASS: {len(cat)} products, {len(jpg)} images')
          PY

      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shop/catalog data/image-credits.json
          git diff --cached --quiet && echo "No photo changes to commit." && exit 0
          git commit -m "Refresh 350 catalog photos from open-license sources"
          git push
