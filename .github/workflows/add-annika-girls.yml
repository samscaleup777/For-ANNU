name: Refresh Annïka girl photography

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-annika-girls.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image tools
        run: python -m pip install requests pillow
      - name: Download real modest-girl photos with visible faces
        run: |
          python - <<'PY'
          from pathlib import Path
          import io, requests
          from PIL import Image, ImageOps

          items=[
            ("annika-girl-01.jpg","23338904"),
            ("annika-girl-02.jpg","36455783"),
            ("annika-girl-03.jpg","10915340"),
            ("annika-girl-04.jpg","6122067"),
            ("annika-girl-05.jpg","8837530")
          ]
          out=Path("assets/real");out.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({"User-Agent":"AnnikaBrandImageImporter/2.0"})
          for filename,pid in items:
            url=f"https://images.pexels.com/photos/{pid}/pexels-photo-{pid}.jpeg?auto=compress&cs=tinysrgb&w=1400"
            r=s.get(url,timeout=60);r.raise_for_status()
            im=Image.open(io.BytesIO(r.content)).convert("RGB")
            if im.width>1400:
              h=int(im.height*1400/im.width);im=im.resize((1400,h),Image.Resampling.LANCZOS)
            # Keep the real person/photo intact; these are editorial site visuals,
            # not claimed as Annïka customers, staff or product endorsements.
            im.save(out/filename,"JPEG",quality=88,optimize=True,progressive=True)
            print("saved",out/filename)

          (out/"GIRL-SOURCES.txt").write_text(
            "Annïka editorial photography sources (Pexels):\n"
            "https://www.pexels.com/photo/woman-in-hijab-23338904/\n"
            "https://www.pexels.com/photo/young-woman-in-traditional-clothing-outdoors-36455783/\n"
            "https://www.pexels.com/photo/a-woman-wearing-a-hijab-10915340/\n"
            "https://www.pexels.com/photo/stylish-muslim-woman-in-modest-clothes-standing-in-lush-park-6122067/\n"
            "https://www.pexels.com/photo/a-hijab-woman-looking-at-the-camera-8837530/\n"
            "These are used as editorial/lifestyle imagery. Pexels permits commercial website use under its license; attribution is not required but is appreciated."
          ,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "annika-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/real
          git diff --cached --quiet || git commit -m "Replace blurred Annïka girl visuals with real portraits"
          git pull --rebase origin main
          git push origin HEAD:main
