name: Add Annïka modest girl photography

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/add-annika-girls.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-images:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow opencv-python-headless==4.10.0.84
      - name: Download and locally blur faces
        run: |
          python - <<'PY'
          from pathlib import Path
          import io, requests
          from PIL import Image, ImageFilter
          import cv2, numpy as np

          items=[
            ("annika-girl-01.jpg","12208801"),
            ("annika-girl-02.jpg","31870373"),
            ("annika-girl-03.jpg","14975735"),
            ("annika-girl-04.jpg","21855219"),
            ("annika-girl-05.jpg","29279059")
          ]
          out=Path("assets/real");out.mkdir(parents=True,exist_ok=True)
          s=requests.Session();s.headers.update({"User-Agent":"AnnikaBrandImageImporter/1.0"})
          detector=cv2.CascadeClassifier(cv2.data.haarcascades+"haarcascade_frontalface_default.xml")

          for filename,pid in items:
            url=f"https://images.pexels.com/photos/{pid}/pexels-photo-{pid}.jpeg?auto=compress&cs=tinysrgb&w=1400"
            r=s.get(url,timeout=60);r.raise_for_status()
            im=Image.open(io.BytesIO(r.content)).convert("RGB")
            if im.width>1400:
              h=int(im.height*1400/im.width);im=im.resize((1400,h),Image.Resampling.LANCZOS)
            arr=np.array(im);gray=cv2.cvtColor(arr,cv2.COLOR_RGB2GRAY)
            boxes=detector.detectMultiScale(gray,1.08,5,minSize=(40,40))
            result=im.copy()
            for x,y,w,h in boxes:
              px,py=int(w*.35),int(h*.35)
              x1=max(0,x-px);y1=max(0,y-py);x2=min(result.width,x+w+px);y2=min(result.height,y+h+py)
              crop=result.crop((x1,y1,x2,y2)).filter(ImageFilter.GaussianBlur(max(14,int(min(w,h)*.32))))
              result.paste(crop,(x1,y1))
            result.save(out/filename,"JPEG",quality=88,optimize=True,progressive=True)
            print("saved",out/filename)

          (out/"GIRL-SOURCES.txt").write_text(
            "Pexels source pages:\n"
            "https://www.pexels.com/photo/a-hijab-woman-in-her-modesty-clothing-12208801/\n"
            "https://www.pexels.com/photo/woman-in-pink-hijab-holding-flower-bouquet-31870373/\n"
            "https://www.pexels.com/photo/a-woman-in-pink-long-sleeve-dress-14975735/\n"
            "https://www.pexels.com/photo/woman-wearing-a-pink-floral-hijab-posing-against-a-pastel-background-21855219/\n"
            "https://www.pexels.com/photo/serene-moment-by-the-lake-in-hijab-fashion-29279059/\n"
            "Faces in downloaded photos are locally blurred before being stored."
          ,encoding="utf-8")
          PY
      - name: Commit
        run: |
          git config user.name "annika-assets-bot"
          git config user.email "actions@users.noreply.github.com"
          git add assets/real
          git diff --cached --quiet || git commit -m "Add pastel modest Muslim girl photography"
          git pull --rebase origin main
          git push origin HEAD:main
