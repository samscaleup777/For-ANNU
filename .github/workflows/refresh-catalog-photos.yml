name: Refresh Annika Catalog Photos

on:
  push:
    branches: [main]
    paths:
      - 'data/shop-catalog.json'
      - 'scripts/refresh_catalog_photos.py'
      - '.github/workflows/refresh-catalog-photos.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: annika-catalog-photo-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow imagehash
      - name: Fetch and validate
        run: python scripts/refresh_catalog_photos.py
      - name: Commit refreshed catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shop/catalog data/image-credits.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh unique licensed catalog photography [skip ci]"
          git push
