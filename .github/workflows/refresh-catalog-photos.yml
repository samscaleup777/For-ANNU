name: Refresh Annika licensed product photos
on:
  push:
    branches: [main]
    paths:
      - 'data/shop-catalog.json'
      - 'scripts/refresh_catalog_photos.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: annika-photo-refresh
  cancel-in-progress: false
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow ImageHash
      - name: Search, verify and download photos
        run: python scripts/refresh_catalog_photos.py
      - name: Commit catalog images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shop/catalog data/image-credits.json
          git diff --cached --quiet && exit 0
          git commit -m "Refresh 350 product photos from licensed sources [skip ci]"
          git push
