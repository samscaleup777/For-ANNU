name: Strict catalog photo refresh

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/refresh_catalog_photos.py"
      - ".github/workflows/catalog-photo-refresh.yml"

permissions:
  contents: write

concurrency:
  group: annika-catalog-photo-refresh
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install photo processing dependencies
        run: python -m pip install --upgrade requests Pillow ImageHash
      - name: Refresh product images using strict name/licence filters
        run: python scripts/refresh_catalog_photos.py
      - name: Commit verified image replacements and audit list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shop/catalog data/image-credits.json
          if git diff --cached --quiet; then
            echo "No verified photo replacements found."
          else
            git commit -m "Refresh verified catalog product photos"
            git push origin main
          fi
