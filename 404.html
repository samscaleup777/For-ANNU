  <meta charset="UTF-8"><script id="annika-reload-scroll-fix">
(function () {
  var entry = window.performance && performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
  var legacyReload = window.performance && performance.navigation && performance.navigation.type === 1;
  var isReload = !!(entry && entry.type === 'reload') || !!legacyReload;
  if (!isReload) return;
  try { if ('scrollRestoration' in history) history.scrollRestoration = 'manual'; } catch (e) {}
  if (location.hash) {
    try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {}
  }
  var interacted = false;
  var markInteracted = function () { interacted = true; };
  ['wheel','touchstart','pointerdown','keydown'].forEach(function (type) {
    window.addEventListener(type, markInteracted, { once:true, passive:type !== 'keydown', capture:true });
  });
  var top = function () {
    if (interacted) return;
    window.scrollTo(0, 0);
    if (document.documentElement) document.documentElement.scrollTop = 0;
    if (document.body) document.body.scrollTop = 0;
  };
  var doubleFrame = function () { requestAnimationFrame(function () { requestAnimationFrame(top); }); };
  top();
  document.addEventListener('DOMContentLoaded', function () { top(); doubleFrame(); }, { once:true });
  window.addEventListener('pageshow', function () { top(); doubleFrame(); }, { once:true });
  window.addEventListener('load', function () { top(); doubleFrame(); }, { once:true });
  window.setTimeout(top, 80);
  window.setTimeout(top, 300);
  window.setTimeout(top, 800);
})();
</script>
