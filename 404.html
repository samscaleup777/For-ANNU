<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f1c18">
  <title>Page not found — Annïka</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--green:#0f1c18;--cream:#faf8f5;--peach:#f2cebe;--ink:#1e2422;--muted:#6b7770}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--cream);color:var(--ink);font-family:'Plus Jakarta Sans',Arial,sans-serif}main{width:min(620px,100%);padding:56px 30px;text-align:center;border:1px solid rgba(30,36,34,.1);border-radius:28px;background:#fff;box-shadow:0 24px 80px rgba(15,28,24,.08)}.code{margin:0 0 10px;color:var(--green);font:600 5rem/1 'Playfair Display',Georgia,serif}.eyebrow{margin:0 0 12px;color:var(--muted);font-size:.75rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase}.title{margin:0 0 12px;font:500 clamp(2rem,5vw,3rem)/1.1 'Playfair Display',Georgia,serif}.copy{margin:0 auto 28px;max-width:480px;color:var(--muted);font-size:.95rem;line-height:1.7}.button{display:inline-flex;padding:12px 18px;border-radius:999px;background:var(--peach);color:#2c1b18;text-decoration:none;font-size:.88rem;font-weight:700}.button:hover{filter:brightness(.97);transform:translateY(-1px)}
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <p class="eyebrow">The page moved</p>
    <h1 class="title">Let’s take you back to Annïka.</h1>
    <p class="copy">That page is not available at this address. The main experience is ready and waiting from the homepage.</p>
    <a class="button" href="/">Back to home →</a>
  </main>
  <script>
    window.si = window.si || function () { (window.siq = window.siq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</body>
</html>
